app-id: com.julianknepel.roon-display
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: roon-display-run
finish-args:
  - --share=network
  - --socket=x11
  - --socket=wayland
  - --device=dri
modules:
  - name: roon-display
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DROON_DISPLAY_BUILD_NATIVE_SHELL=ON
      - -DROON_DISPLAY_FLATPAK=ON
    sources:
      - type: dir
        path: ../..
    build-commands:
      - install -Dm755 packaging/flatpak/roon-display-run /app/bin/roon-display-run
      - install -Dm644 packaging/flatpak/com.julianknepel.roon-display.desktop /app/share/applications/com.julianknepel.roon-display.desktop
